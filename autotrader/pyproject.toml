[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autotrader"
version = "0.1.0"
description = "Config-driven algorithmic trading engine: backtest, paper, live (Alpaca) with hard risk rails"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6",
    "python-dotenv>=1",
    "alpaca-py>=0.30",
    "lxml>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
autotrader = "autotrader.__main__:main"

[tool.setuptools.packages.find]
include = ["autotrader*"]

[tool.setuptools.package-data]
autotrader = ["universe/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
